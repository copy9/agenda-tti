// Aplicativo propositalmente enxuto: só o que o Android já traz, sem bibliotecas externas.
// Menos dependência significa compilação mais confiável e APK pequeno.
apply plugin: 'com.android.application'

android {
  namespace 'br.com.agendatti'
  compileSdk 34

  defaultConfig {
    applicationId 'br.com.agendatti'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      // assinado com a chave de depuração para poder ser instalado direto, sem loja
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
