name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Título em Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\([a-z0-9._/-]+\))?!?: .{3,}'; then
            echo "::error::O título do PR precisa seguir Conventional Commits, por exemplo: feat(ui): skeleton na lista de casas"
            exit 1
          fi
      - name: Descrição menciona a issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|related to)[: ]+#[0-9]+'; then
            echo "::error::A descrição do PR precisa mencionar a issue: 'Closes #N' (ou 'Refs #N' se for parcial). Veja AGENTS.md §2."
            exit 1
          fi
