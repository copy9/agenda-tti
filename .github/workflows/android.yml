# Compila o aplicativo Android e publica o arquivo .apk para download.
# A compilação roda aqui porque o ambiente do GitHub já traz o SDK do Android.
name: Aplicativo Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Levar a plataforma para dentro do aplicativo
        run: cp index.html android/app/src/main/assets/index.html

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar o APK como arquivo baixável
        uses: actions/upload-artifact@v4
        with:
          name: agenda-tti-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar em Releases (link fixo para download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/release/*.apk agenda-tti.apk
          gh release view app-android >/dev/null 2>&1 || gh release create app-android \
            --title "Agenda TTI para Android" \
            --notes "Baixe **agenda-tti.apk** e abra o arquivo no celular para instalar. Como não vem da Play Store, o Android pede uma confirmação de fonte desconhecida na primeira vez. O aplicativo é atualizado a cada versão publicada aqui."
          gh release upload app-android agenda-tti.apk --clobber
